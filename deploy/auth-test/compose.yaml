# Local stand-in for the org login: Dex = OAM, oauth2-proxy 7.15.5 = the auth component, whoami = our app.
# whoami answers every request with the headers it received, i.e. exactly what the chat would see.
#
#   docker compose up -d      → browser: http://localhost:4180  (max.muster@example.org / password)
#   ./run-test.sh             → the same login with curl, prints the headers
#   docker compose down
#
# Image names can be overridden for a registry mirror (e.g. OAUTH2_PROXY_IMAGE=<artifactory>/oauth2-proxy/oauth2-proxy:v7.15.5).
name: auth-test

services:
  dex:
    image: ${DEX_IMAGE:-ghcr.io/dexidp/dex:v2.44.0}
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro${SELINUX_LABEL:-}
    ports:
      - "127.0.0.1:5556:5556" # login page
      - "127.0.0.1:4180:4180" # oauth2-proxy (it lives in this container's network namespace)

  oauth2-proxy:
    image: ${OAUTH2_PROXY_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.15.5}
    # shares Dex's network namespace: "localhost:5556" is Dex for the browser and for the proxy alike
    network_mode: "service:dex"
    depends_on: [dex, whoami]
    restart: on-failure # first start can race Dex's discovery endpoint
    command:
      - --provider=oidc
      - --oidc-issuer-url=http://localhost:5556/dex
      - --client-id=chat-poc
      - --client-secret=chat-poc-secret
      - --redirect-url=http://localhost:4180/oauth2/callback
      - --upstream=http://whoami:80
      - --http-address=0.0.0.0:4180
      - --email-domain=*
      - --scope=openid email profile
      - --cookie-secret=0123456789abcdef0123456789abcdef
      - --cookie-secure=false
      - --skip-provider-button=true
      - --approval-prompt=auto # the default "force" makes Dex show its consent page despite skipApprovalScreen

  whoami:
    image: ${WHOAMI_IMAGE:-traefik/whoami:v1.11.0}
