# oc apply -k deploy/k8s        (vorher: Secrets und die Ontologie-ConfigMap anlegen, siehe README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config.yaml
  - chat.yaml
  - ingest.yaml
  # - networkpolicy.yaml        # PRÜFEN: erst aktivieren, wenn die Labels von Auth-Proxy und Gateway bestätigt sind
labels:
  - pairs:
      app.kubernetes.io/part-of: bhb-rag
images:                          # PRÜFEN: Registry und Tag eintragen
  - name: chat-system
    newName: REGISTRY/bhb/chat-system
    newTag: "0.1.0"
  - name: ingest-service
    newName: REGISTRY/bhb/ingest-service
    newTag: "0.1.0"
