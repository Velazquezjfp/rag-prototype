# VORLAGE - nicht mit echten Werten einchecken. PRÜFEN: Secrets kommen im Zielsystem aus Vault?
# Anlegen z. B.:  oc create secret generic chat-secrets --from-literal=RAG__OPENSEARCH__PASSWORD=... (README.md)
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
type: Opaque
stringData:
  RAG__OPENSEARCH__PASSWORD: "CHANGE_ME"           # Passwort von bhb_reader
  RAG__EMBEDDING__API_KEY: "CHANGE_ME"
  RAG__LLM__API_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: ingest-secrets
type: Opaque
stringData:
  INGEST__API_KEY: "CHANGE_ME"                     # der Schlüssel für X-API-Key; lang und zufällig
  OSI__OPENSEARCH__PASSWORD: "CHANGE_ME"           # Passwort von bhb_writer
