[project]
name = "ingest-service"
version = "0.1.0"
description = "Ingest API of the RAG prototype: PDF + ontology in, docling-graph-service call, indexing into OpenSearch with opensearch-index"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
]
# The sibling module opensearch-index (indexer, client, index names, ontology) is not on PyPI:
# requirements.txt installs it editable next to this package; the Dockerfile copies it into the image.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real OpenSearch on localhost:9200 with a throwaway index prefix (INGEST_INTEGRATION=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "ISC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ingest_service"]

[tool.ruff.lint.per-file-ignores]
"src/ingest_service/api.py" = ["B008"]  # FastAPI idiom: File(...)/Form(...)/Depends(...) as defaults
