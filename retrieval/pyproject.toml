[project]
name = "rag-retrieval"
version = "0.1.0"
description = "Retrieval + prompt injection for the RAG prototype (module 3): hybrid OpenSearch search with client-side RRF, 1-hop graph expansion, German context rendering, OpenAI-compatible chat client with guardrail"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opensearch-py>=3.2,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
]
# The sibling module opensearch-index (client factory, index names, ontology, identifiers) is not on PyPI:
# requirements.txt installs it editable next to this package.

[project.scripts]
rag-retrieve = "rag_retrieval.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs the OpenSearch node with both manuals indexed plus the embedding/LLM endpoint (RAG_INTEGRATION=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "ISC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/rag_retrieval/cli.py" = ["B008"]  # typer idiom
"tests/*" = ["E731", "E741"]
