  # ------------------------------------------------------------------ contradiction handling (1)
  - id: Q31
    title: "Duration of the Vault incident on 02.07.2026 (38 vs 48 minutes)"
    class: contradiction-handling
    profile: both
    doc_filter: null
    language: de
    requires_docs: [BHB-PLT-0007, BHB-PLT-0001]
    setup: []
    input: |
      Wie lange hat der Vault-Vorfall am 02.07.2026 gedauert?
    expected:
      behaviour: contradiction_both
      behaviour_strict: contradiction_both
      must:
        - "38 Minuten with source [BHB-PLT-0007 S. 22 or S. 23] AND 48 Minuten with source [BHB-PLT-0001 S. 22 or S. 23]"
        - "both ticket ids: ZSDSUP-0247 and CAASUP-0351 (DDSUP-1201 optional)"
        - "the explanation of the difference: ZSD measures from the report to the unseal, the platform from the start of the node maintenance to full synchronisation of all tenants [BHB-PLT-0007 S. 22]"
        - "assistant: block Aufgabe=Erklärung; both profiles: neither value discarded"
      must_not:
        - "one value only, or an average"
        - "declare one manual wrong"
      judge_notes: "The '22 Minuten Zusammenrufen' (ZSD) vs '31 Minuten Wartezeit' (CaaS) sub-durations are a bonus, not required."
    score_weight: 3

  # ------------------------------------------------------------------ long conversation (2)
  - id: Q32
    title: "Seven-turn dialogue; the last turn refers to turn 1 (history window)"
    class: long-conversation
    profile: assistant
    doc_filter: null
    language: de
    requires_docs: [BHB-PLT-0007, BHB-PLT-0001]
    setup:
      - "Über welche Firewall-Regel verschickt die PKI ihre Ablauf- und Sperrbenachrichtigungen?"
      - "Wer ist für die Firewallregeln des ZSD zuständig?"
      - "Wie entsiegle ich den Vault?"
      - "Wer hält die fünf Schlüsselanteile?"
      - "Was passiert bei den Dokumentendiensten, wenn Vault versiegelt ist?"
      - "Welche Ankündigungspflicht gilt für Knotenwartungen, die einen Vault-Knoten berühren?"
    input: |
      Zurück zu meiner allerersten Frage in diesem Gespräch: Welche Regel-ID hatte ich da gemeint, und über welchen Host und Port läuft sie?
    expected:
      behaviour: answer
      must:
        - "with RAG__RETRIEVAL__HISTORY_TURNS ≥ 7 (server value 10): names FW-ZSD-014 → smtp.bavd.intern, TCP 25 with source [BHB-PLT-0007 S. 10]; block Grundlage includes Verlauf"
        - "with the dev default 3: does not invent — acceptable are 'die erste Frage liegt nicht mehr im Verlauf' plus an ask-back, or the correct FW-ZSD-014 if retrieval happened to bring it"
        - "record diagnostics.history_turns_used and question_rewritten (the rewrite sees only the last 2 turns and cannot recover turn 1)"
        - "setup turns 1–6 themselves must be grounded (spot-check: turn 1 → FW-ZSD-014 S. 10; turn 4 → Tabelle 14 S. 27; turn 6 → 24 Stunden vorher an zsd@bavd.bund.de S. 12/22)"
      must_not:
        - "name a different rule (e.g. FW-ZSD-004 or FW-CAAS-004) as 'your first question'"
        - "claim the first question was about something else"
      judge_notes: >-
        This is the only case where the expected answer depends on a setting; run it with HISTORY_TURNS=3 and =10 if
        the budget allows (7 messages each) and report both. anna.admin allows 20 turns per conversation.
    score_weight: 3

  - id: Q33
