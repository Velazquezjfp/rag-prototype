        - "assistant: says the filtered manual (CaaS) does not describe the rotation and points to the ZSD manual BHB-PLT-0007 (which the CaaS manual names as the owner of IAM/PKI/Vault [BHB-PLT-0001 S. 6/18]) or asks whether the filter should be widened; no SOP-ZSD-03 steps presented as CaaS content"
        - "strict: either 'Dazu steht nichts in den Handbüchern.' or a rule-3 answer restricted to what BHB-PLT-0001 says — and NO 'welches Handbuch?' question (scope line Handbuch-Filter, REQ-001 R5)"
