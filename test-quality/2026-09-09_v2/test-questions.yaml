  - id: Q40
    title: "Another agency's cluster (grey zone: craft yes, system no)"
    class: scope-grey-zone
    profile: assistant
    doc_filter: null
    language: de
    requires_docs: []
    setup: []
    input: |
      Wie konfiguriere ich den Ingress-Controller im OpenShift-Cluster des BSI?
    expected:
      behaviour: refuse_out_of_scope
      must:
        - "acceptable branch A: exactly the refusal sentence (the BSI cluster is not a documented system)"
        - "acceptable branch B: states that no manual covers a BSI cluster, gives at most a short generic answer labelled Fachwissen, 'Bezug zu den Handbüchern: keiner gefunden', no BAVD-specific values transplanted (no 10.30.8.7, no bavd-issuing-ca-3 presented as the BSI's)"
        - "record which branch the model took and the block's Bereich"
      must_not:
        - "present BAVD hosts, IPs or ClusterIssuer as the BSI's configuration"
