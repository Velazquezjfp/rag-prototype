      sink.file token written) with 1-second timestamps starting 2026-09-09 05:40:00.000Z until the text exceeds
      12 000 characters; first line is the agent start line naming namespace dokumentendienste-prod and pod
      dd-ingest-worker-7c9f4d6b8-x2ktp; the LAST two lines are the ERROR 'Code: 503. Errors: * Vault is sealed' and
      the WARN 'Init:CrashLoopBackOff restartCount=6'. The exact script is in run.commands.material_generator_Q10.
    expected:
      behaviour: answer
      must:
        - "diagnostics.material_truncated == true and 7900 ≤ diagnostics.material_chars ≤ 8200; len(diagnostics.question) ≤ 700; finish_reason == stop"
        - "the answer identifies the sealed Vault from the kept tail (the last ERROR line) → SOP-ZSD-05, Marcel Ebert, three shares [BHB-PLT-0007 S. 15], precedent ZSDSUP-0247 [S. 22]"
