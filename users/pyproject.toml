[project]
name = "rag-users"
version = "0.1.0"
description = "Mock auth/policy seam of the RAG prototype: AuthContext from an env or ingress-header adapter, hardcoded users, per-group daily message cap, turn cap and allowed manuals (SPEC §10.2, ADR-0008)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_users"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "ISC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "E741"]
